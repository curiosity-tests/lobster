name: Build and Cache clang-tidy
run-name: "Build and Cache clang-tidy ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: >-
          Branch or commit to check out and build. Uses the Workflow branch as the
          default if not specified.
          Note that the resulting cache will be specific to the Workflow branch, not
          specific to the branch or commit given here.
          Use this setting if you deliberately want to build the cache from a branch
          different to the Workflow branch.
          Use with care, especially when running the Workflow from the main branch.
        required: false
        type: string

      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
  id-token: write
  contents: read

jobs:
  build-clang-tidy-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install cmake ninja-build

      - name: Cache clang-tidy
        id: cache-clang-tidy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/work/lobster/llvm-project/build/bin/clang-tidy
          key: cache-clang-tidy

      - name: Build clang-tidy
        if: steps.cache-clang-tidy.outputs.cache-hit != 'true'
        run: |
          make clang-tidy

      - name: Print clang-tidy version (debug step)
        run: |
          ~/work/lobster/llvm-project/build/bin/clang-tidy --version
